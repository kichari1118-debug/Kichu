          display:block;
          border-radius: 58% 12% 62% 28% / 52% 18% 78% 38%;

          transform-origin: 50% 65%;
          animation: roseSpin var(--dur) linear var(--del) infinite;
          position:relative;
        }
        .petal-shape::after {
          content:'';

          top:18%; left:22%;
          width:38%; height:52%;

        @keyframes roseSpin {

        @keyframes slideInUp { from { transform:translateY(80px); opacity:0; } to { transform:translateY(0); opacity:1; } }
